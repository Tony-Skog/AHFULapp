name: Protect Priority Labels

on:
  issues:
    types: [labeled]

jobs:
  enforce-label-permissions:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check label and remove if unauthorized
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const PROTECTED_LABELS = ['low priority', 'high priority'];
            const ALLOWED_ROLES = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            const label = context.payload.label.name.toLowerCase();
            const sender = context.payload.sender.login;
            const issueNumber = context.payload.issue.number;

            // Only act on protected labels
            if (!PROTECTED_LABELS.includes(label)) {
              console.log(`Label "${label}" is not protected. No action taken.`);
              return;
            }

            console.log(`Protected label "${label}" was applied by ${sender}. Checking permissions...`);

            // Get the user's association to this repo
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Check author association of the person who applied the label
            // We need to check via repo collaborators API
            let isAuthorized = false;

            try {
              const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: sender,
              });

              const permission = permissionData.permission;
              console.log(`User ${sender} has permission level: ${permission}`);

              // Allow: admin, maintain, write (contributors/collaborators)
              // Deny: read, none
              const ALLOWED_PERMISSIONS = ['admin', 'maintain', 'write'];
              isAuthorized = ALLOWED_PERMISSIONS.includes(permission);

            } catch (err) {
              // If we can't find them as a collaborator, they're not authorized
              console.log(`Could not verify collaborator status for ${sender}: ${err.message}`);
              isAuthorized = false;
            }

            if (isAuthorized) {
              console.log(`✅ ${sender} is authorized to apply "${label}". No action taken.`);
              return;
            }

            // Remove the label
            console.log(`❌ ${sender} is not authorized. Removing label "${label}"...`);

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: context.payload.label.name, // use original casing
            });

            // Post a comment explaining why the label was removed
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `👋 Hey @${sender}! The **${context.payload.label.name}** label can only be applied by contributors, maintainers, and admins. It has been automatically removed.`,
            });

            console.log(`Label removed and comment posted on issue #${issueNumber}.`);
